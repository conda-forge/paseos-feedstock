{% set name = "paseos" %}
{% set org = "aidotse" %}
{% set version = "0.2.1" %}
{% set sha256 = "d64fe0d245abe062f06f46b17cd898b2fe6fb0eac464c11ea6d89c275f05339f" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/{{ org }}/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed --ignore-requires-python .

requirements:
  host:
    - python >=3.8,<3.12
    - pip
    - setuptools
  run:
    # Mirrors [project.dependencies] in the upstream pyproject.toml for v0.2.1.
    - python >=3.8,<3.12
    - dotmap >=1.3.30
    - loguru >=0.6.0
    # numpy is hard-pinned below and matplotlib >=3.11 requires numpy >=1.25,
    # so an uncapped matplotlib makes the environment unimportable.
    - matplotlib-base >=3.6.0,<3.11
    - numpy ==1.23.5
    # pykep 3.x is an incompatible API rewrite, not a compatible successor.
    - pykep >=2.6,<3
    - pyquaternion >=0.9.9
    - scikit-spatial >=6.5.0
    - skyfield >=1.45
    - toml >=0.10.2
    - trimesh >=4.0.7

test:
  imports:
    - paseos
  requires:
    - pytest
    - pytest-asyncio
  source_files:
    - paseos/tests
    # Carries [tool.pytest.ini_options]; without asyncio_mode = "auto" the
    # unmarked async tests error out under pytest 8+.
    - pyproject.toml
  commands:
    #- pip check # Note this leads to problems with pykep not being found, likely as pykep on pip is discontinued
    - pytest --ignore paseos/tests/visualization_test.py

about:
  home: https://github.com/aidotse/paseos
  summary: A package which simulates the space environment for operating multiple spacecraft.
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  doc_url: https://paseos.readthedocs.io/en/latest/
  dev_url: https://github.com/aidotse/paseos/

extra:
  recipe-maintainers:
    - gomezzz
